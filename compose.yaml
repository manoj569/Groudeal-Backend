services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: groupbuy
      POSTGRES_USER: groupbuy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupbuy -d groupbuy"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
