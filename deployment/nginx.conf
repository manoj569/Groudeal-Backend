pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  # Deliberately excludes query strings, bodies, Authorization and personal identifiers.
  log_format safe '$request_method $status $request_time';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  scgi_temp_path /tmp/scgi;
  uwsgi_temp_path /tmp/uwsgi;
  client_max_body_size 64k;
  limit_req_zone $binary_remote_addr zone=groudeal_api:10m rate=5r/s;
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/edge_certificate;
    ssl_certificate_key /run/secrets/edge_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
      limit_req zone=groudeal_api burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 5s;
      proxy_read_timeout 35s;
      proxy_send_timeout 35s;
      proxy_buffering off;
    }
  }
}

